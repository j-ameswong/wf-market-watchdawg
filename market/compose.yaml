services:
  postgres:
    # Postgres 18 with TimescaleDB (R2.1). Keep the tag in step with TestcontainersConfiguration;
    # TimescaleTest fails if they differ. PGDATA and the volume path match postgres:18-alpine, so a
    # volume that image initialised is reused as is.
    image: timescale/timescaledb:2.30.1-pg18
    # The image's first-boot scripts would also set these, but they only run against an empty data
    # directory. On the command line they hold for any volume.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    labels:
      # spring-boot-docker-compose recognises Postgres by image name, and this one is not named
      # postgres. Without the label bootRun gets no datasource.
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: watchdawg
      POSTGRES_USER: watchdawg
      POSTGRES_PASSWORD: watchdawg
    ports:
      - "5432:5432"
    volumes:
      - watchdawg-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdawg -d watchdawg"]
      interval: 5s
      retries: 10

volumes:
  watchdawg-pgdata:
