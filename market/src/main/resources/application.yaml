spring:
  application:
    name: market
  docker:
    compose:
      lifecycle-management: start_and_stop

# R12.5: actuator is the service's only HTTP surface, and only the endpoints named here.
# Postgres is the read surface for the warehouse itself (ADR-0011). There is no data API and no
# plan for one. Guarded by HttpSurfaceTest.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

wfm:
  base-url: https://api.warframe.market/v2
  base-url-legacy: https://api.warframe.market/v1
  user-agent: "wf-market-watchdawg/0.1 (+https://github.com/j-ameswong/wf-market-watchdawg)"
  platform: pc
  crossplay: true
  limits:
    public:
      permits: 2 # upstream ceiling: 3 req/s
      per: 1s
    contract-search:
      permits: 12 # upstream ceiling: 20 req/min
      per: 1m
    max-concurrency: 2
    max-retry-after: 60s
  sync:
    interval: 1h
    initial-delay: 30s
