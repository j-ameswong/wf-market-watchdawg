spring:
  application:
    name: market
  # R9a.1: the watches. The test classpath carries an empty watches.yaml that shadows this one.
  config:
    import: ${WATCHDAWG_WATCHES:classpath:watches.yaml}
  docker:
    compose:
      lifecycle-management: start_and_stop

# R12.5: actuator is the service's only HTTP surface, and only the endpoints named here.
# Postgres is the read surface for the warehouse itself (ADR-0011). There is no data API and no
# plan for one. Guarded by HttpSurfaceTest.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

# Runs every @Scheduled component. The test harness sets it false in every Spring test context,
# so no timer can call out of a test (R2.6).
watchdawg:
  scheduling:
    enabled: true
  # C9a: at most this many signals a UTC day, across all watches, may be sent (R9a.8). The rest
  # are recorded as suppressed. A ceiling, not a target: a quiet day is not a defect.
  alerts:
    daily-ceiling: 50
  # C10. The real topics are credentials: set WATCHDAWG_NOTIFY_TOPICS_<NAME> in the environment
  # for each logical topic the watches name (R10.6). With none set, nothing is sent and signals
  # wait in the outbox.
  notify:
    base-url: https://ntfy.sh
    interval: 10s
    batch-size: 20
    max-attempts: 5
    backoff: 30s

wfm:
  base-url: https://api.warframe.market/v2
  base-url-legacy: https://api.warframe.market/v1
  user-agent: "wf-market-watchdawg/0.1 (+https://github.com/j-ameswong/wf-market-watchdawg)"
  platform: pc
  crossplay: true
  limits:
    public:
      permits: 2 # upstream ceiling: 3 req/s
      per: 1s
    contract-search:
      permits: 12 # upstream ceiling: 20 req/min
      per: 1m
    max-concurrency: 2
    max-retry-after: 60s
  # C6: every watched item's book, once per interval. N items cost N / interval on the public
  # bucket: 20 items at 2m is 0.17 req/s of the 2 configured.
  poll:
    interval: 2m
    initial-delay: 1m
  sync:
    interval: 1h
    initial-delay: 30s
    # /v2/item/{slug} fills what /v2/items leaves out. One batch per interval: 30 a minute is
    # 0.5 req/s, so a whole catalog of ~3.9k items takes a little over two hours. Off until a rule
    # or query reads tradable, rarity or max_charges.
    item-details:
      enabled: false
      batch-size: 30
      interval: 1m
      initial-delay: 2m
