# R2.7: test classes and methods run in random order, so an order dependence fails a run instead of
# hiding behind a lucky one. build.gradle.kts prints the seed; replay it with -PtestSeed=<seed>.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
